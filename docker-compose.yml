services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_training
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      [
        "/bin/sh",
        "-c",
        # "ollama serve & sleep 10 && ollama pull deepseek-r1:1.5b && wait"
        
        "ollama serve & sleep 10 && ollama pull qwen2.5:7b && wait"
      ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data: